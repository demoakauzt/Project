<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 Uy Mebellari - Zamonaviy Dizayn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            color: #2c3e50;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .cart-btn {
            position: relative;
            background: #ff6b6b;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cart-btn:hover {
            background: #ee5a52;
            transform: scale(1.05);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #feca57;
            color: #2c3e50;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 80px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        /* Categories */
        .categories {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 40px;
            color: #2c3e50;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        .category-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .category-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .category-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .category-name {
            font-size: 18px;
            font-weight: 600;
        }

        /* Products */
        .products {
            max-width: 1200px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            transition: all 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
        }

        .product-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff6b6b;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .product-desc {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 15px;
        }

        .product-price {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 15px;
        }

        .old-price {
            text-decoration: line-through;
            color: #95a5a6;
            font-size: 16px;
            margin-left: 10px;
        }

        .buy-button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .buy-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        /* Cart Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 25px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 32px;
            cursor: pointer;
            color: #7f8c8d;
        }

        .cart-item {
            display: flex;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 2px solid #ecf0f1;
        }

        .cart-item-image {
            font-size: 60px;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .cart-item-price {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .qty-btn {
            width: 35px;
            height: 35px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }

        .qty-btn:hover {
            background: #667eea;
            color: white;
        }

        .quantity {
            font-size: 18px;
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        .cart-total {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 3px solid #667eea;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .empty-cart {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .empty-cart-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        /* Success Message */
        .success-message {
            display: none;
            position: fixed;
            top: 100px;
            right: 20px;
            background: #2ecc71;
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.4);
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Scroll to Top Button */
        .scroll-top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(100px);
        }

        .scroll-top-btn.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-top-btn:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        .scroll-top-btn:active {
            transform: translateY(-2px) scale(1.05);
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 32px;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .scroll-top-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="logo">🏠 Mebel Marketi</div>
            <div class="nav-buttons">
                <button class="nav-btn">Bosh sahifa</button>
                <button class="nav-btn">Katalog</button>
                <button class="cart-btn" onclick="toggleCart()">
                    🛒 Savat
                    <span class="cart-count" id="cart-count">0</span>
                </button>
                <button class="nav-btn" onclick="logout()" style="background: rgba(255,107,107,0.3); border-color: #ff6b6b;">
                   <a href="./index.html">🚪 Chiqish</a> 
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <div class="hero">
        <h1>🏠 Zamonaviy Uy Mebellari</h1>
        <p>Uyingizni bezatadigan eng sifatli mebellar</p>
    </div>

    <!-- Categories -->
    <div class="categories">
        <h2 class="section-title">Kategoriyalar</h2>
        <div class="category-grid">
            <div class="category-card" onclick="filterCategory('divan')">
                <div class="category-icon">🛋️</div>
                <div class="category-name">Divanlar</div>
            </div>
            <div class="category-card" onclick="filterCategory('kreslo')">
                <div class="category-icon">🪑</div>
                <div class="category-name">Kreslolar</div>
            </div>
            <div class="category-card" onclick="filterCategory('shkaf')">
                <div class="category-icon">🗄️</div>
                <div class="category-name">Shkaflar</div>
            </div>
            <div class="category-card" onclick="filterCategory('stol')">
                <div class="category-icon">🍽️</div>
                <div class="category-name">Stollar</div>
            </div>
            <div class="category-card" onclick="filterCategory('stul')">
                <div class="category-icon">💺</div>
                <div class="category-name">Stullar</div>
            </div>
            <div class="category-card" onclick="filterCategory('all')">
                <div class="category-icon">✨</div>
                <div class="category-name">Hammasi</div>
            </div>
        </div>
    </div>

    <!-- Products -->
    <div class="products">
        <h2 class="section-title">Mashhur Mahsulotlar</h2>
        <div class="product-grid" id="product-grid"></div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal" onclick="if(event.target === this) toggleCart()">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">🛒 Savatingiz</h2>
                <button class="close-btn" onclick="toggleCart()">×</button>
            </div>
            <div id="cart-items"></div>
            <div class="cart-total" id="cart-total-section" style="display:none">
                <div class="total-row">
                    <span>Jami:</span>
                    <span id="cart-total-price">0 so'm</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">✅ Buyurtma berish</button>
            </div>
        </div>
    </div>

    <!-- Success Message -->
    <div class="success-message" id="success-message">
        ✅ Mahsulot savatga qo'shildi!
    </div>

    <!-- Scroll to Top Button -->
    <button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()">
        ⬆️
    </button>

    <script>
        const products = [
            // Divanlar
            { id: 1, name: "Zamonaviy Divan", desc: "3 kishilik yumshoq divan", price: 4500000, oldPrice: 5200000, icon: "🛋️", category: "divan", badge: "TOP" },
            { id: 2, name: "Burchak Divan", desc: "L shaklidagi keng divan", price: 6800000, oldPrice: 7500000, icon: "🛋️", category: "divan", badge: "-15%" },
            { id: 3, name: "Premium Divan", desc: "Teri qoplamali hashamatli", price: 8900000, oldPrice: 10000000, icon: "🛋️", category: "divan", badge: "YANGI" },
            
            // Kreslolar
            { id: 4, name: "Ofis Kreslo", desc: "Ergonamik dizayn", price: 1200000, oldPrice: 1450000, icon: "🪑", category: "kreslo", badge: "-20%" },
            { id: 5, name: "Dam Olish Kreslo", desc: "Aylanuvchi mekanizm", price: 2100000, oldPrice: 2400000, icon: "🪑", category: "kreslo", badge: "TOP" },
            { id: 6, name: "Klassik Kreslo", desc: "Yog'och oyoqli", price: 950000, oldPrice: 1150000, icon: "🪑", category: "kreslo", badge: "-18%" },
            
            // Shkaflar
            { id: 7, name: "Garderob Shkaf", desc: "4 eshikli keng shkaf", price: 5500000, oldPrice: 6200000, icon: "🗄️", category: "shkaf", badge: "YANGI" },
            { id: 8, name: "Kitob Shkafi", desc: "Ochiq javonli", price: 2800000, oldPrice: 3200000, icon: "📚", category: "shkaf", badge: "-15%" },
            { id: 9, name: "Kiyim Shkafi", desc: "Oynalik 3 eshik", price: 4200000, oldPrice: 4800000, icon: "👔", category: "shkaf", badge: "TOP" },
            
            // Stollar
            { id: 10, name: "Ovqatlanish Stoli", desc: "6 kishi uchun", price: 3200000, oldPrice: 3800000, icon: "🍽️", category: "stol", badge: "-20%" },
            { id: 11, name: "Kompyuter Stoli", desc: "O'quv va ish uchun", price: 1800000, oldPrice: 2100000, icon: "💻", category: "stol", badge: "TOP" },
            { id: 12, name: "Kofe Stoli", desc: "Shisha ustki qismi", price: 890000, oldPrice: 1050000, icon: "☕", category: "stol", badge: "-15%" },
            
            // Stullar
            { id: 13, name: "Ovqatlanish Stul", desc: "Yog'och klassik", price: 450000, oldPrice: 550000, icon: "💺", category: "stul", badge: "-18%" },
            { id: 14, name: "Bar Stul", desc: "Baland oyoqli", price: 680000, oldPrice: 780000, icon: "🍷", category: "stul", badge: "YANGI" },
            { id: 15, name: "Bolalar Stul", desc: "Rangli va xavfsiz", price: 320000, oldPrice: 400000, icon: "👶", category: "stul", badge: "-20%" },
        ];

        let cart = [];
        let currentFilter = 'all';

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const filtered = currentFilter === 'all' 
                ? products 
                : products.filter(p => p.category === currentFilter);

            grid.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <div class="product-image">
                        ${p.icon}
                        <div class="product-badge">${p.badge}</div>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-price">
                            ${p.price.toLocaleString()} so'm
                            <span class="old-price">${p.oldPrice.toLocaleString()}</span>
                        </div>
                        <button class="buy-button" onclick="addToCart(${p.id})">
                            🛒 Savatga qo'shish
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(category) {
            currentFilter = category;
            renderProducts();
            window.scrollTo({ top: 600, behavior: 'smooth' });
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCart();
            showSuccessMessage();
        }

        function updateCart() {
            document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            renderCart();
        }

        function renderCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const totalSection = document.getElementById('cart-total-section');

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <h3>Savat bo'sh</h3>
                        <p>Mahsulotlar qo'shing</p>
                    </div>
                `;
                totalSection.style.display = 'none';
                return;
            }

            cartItemsDiv.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-image">${item.icon}</div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">${item.price.toLocaleString()} so'm</div>
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="changeQuantity(${item.id}, -1)">-</button>
                            <span class="quantity">${item.quantity}</span>
                            <button class="qty-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-total-price').textContent = total.toLocaleString() + ' so\'m';
            totalSection.style.display = 'block';
        }

        function changeQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== productId);
            }

            updateCart();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('active');
        }

        function showSuccessMessage() {
            const msg = document.getElementById('success-message');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2000);
        }

        function checkout() {
            if (cart.length === 0) return;
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            alert(`✅ Buyurtma qabul qilindi!\n\nJami: ${total.toLocaleString()} so'm\n\nTez orada siz bilan bog'lanamiz!`);
            
            cart = [];
            updateCart();
            toggleCart();
        }

        // Scroll to Top Functionality
        const scrollTopBtn = document.getElementById('scroll-top-btn');

        // Show button immediately for testing
        setTimeout(() => {
            scrollTopBtn.classList.add('show');
        }, 500);

        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 200) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // Logout Function
        function logout() {
            const confirm = window.confirm('Saytdan chiqmoqchimisiz?');
            if (confirm) {
                alert('✅ Tizimdan chiqdingiz!\n\nXayr, yana ko\'rishguncha! 👋');
                // Clear cart
                cart = [];
                updateCart();
                // Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Initial render
        renderProducts();
    </script>
</body>
</html>
