<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 Smartfony - Eng Yangi Telefonlar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #667eea;
        }

        .header-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .cart-btn, .logout-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.3s;
        }

        .logout-btn {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
        }

        .cart-btn:hover, .logout-btn:hover {
            transform: translateY(-2px);
        }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 60px auto;
            padding: 60px 20px;
            text-align: center;
            color: white;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 2px 2px 20px rgba(0,0,0,0.2);
            animation: fadeInUp 0.8s ease;
        }

        .hero p {
            font-size: 22px;
            margin-bottom: 40px;
            opacity: 0.95;
            animation: fadeInUp 0.8s ease 0.2s backwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Products Section */
        .products {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 42px;
            font-weight: 800;
            color: white;
            margin-bottom: 50px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: contain;
            margin-bottom: 20px;
            transition: transform 0.3s;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .product-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #333;
        }

        .product-specs {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .product-price {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .buy-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        /* Filter Section */
        .filters {
            max-width: 1200px;
            margin: 0 auto 40px;
            padding: 0 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: white;
            color: #667eea;
            border-color: white;
        }

        /* Cart Modal */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .cart-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-total {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #667eea;
            text-align: right;
            font-size: 24px;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 36px;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">📱 Smartfony</div>
            <ul class="nav-links">
                <li><a href="#home">Bosh sahifa</a></li>
                <li><a href="#products">Mahsulotlar</a></li>
                <li><a href="#about">Biz haqimizda</a></li>
                <li><a href="#contact">Aloqa</a></li>
            </ul>
            <div class="header-buttons">
                <button class="cart-btn" onclick="toggleCart()">🛒 Savat (<span id="cart-count">0</span>)</button>
                <a href="./index.html" class="logout-btn" onclick="logout()">Chiqish 🚪</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <h1>Eng Yangi Smartfonlar</h1>
        <p>Premium sifat, hamyonbop narxlar. O'zbekistonda yetkazib berish!</p>
    </section>

    <div class="filters">
        <button class="filter-btn active" onclick="filterProducts('all')">Hammasi</button>
        <button class="filter-btn" onclick="filterProducts('premium')">Premium</button>
        <button class="filter-btn" onclick="filterProducts('budget')">Arzon</button>
        <button class="filter-btn" onclick="filterProducts('flagship')">Flagship</button>
    </div>

    <section class="products">
        <div class="product-grid" id="product-grid"></div>
    </section>

    <div class="cart-modal" id="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>Savatingiz</h2>
                <button class="close-btn" onclick="toggleCart()">×</button>
            </div>
            <div id="cart-items"></div>
            <div class="cart-total">
                Jami: <span id="cart-total">0</span> so'm
            </div>
            <button class="buy-btn" onclick="checkout()">Buyurtma berish</button>
        </div>
    </div>

    <script>
        const products = [
            {
                id: 1,
                name: "iPhone 15 Pro Max",
                category: "flagship",
                badge: "Eng mashhur",
                specs: "A17 Pro chip • 256GB • 48MP kamera • Titan dizayn",
                price: 16500000,
                image: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=400&h=400&fit=crop"
            },
            {
                id: 2,
                name: "Samsung Galaxy S24 Ultra",
                category: "flagship",
                badge: "Yangi",
                specs: "Snapdragon 8 Gen 3 • 512GB • 200MP • S Pen",
                price: 15800000,
                image: "https://images.unsplash.com/photo-1610945415295-d9bbf067e59c?w=400&h=400&fit=crop"
            },
            {
                id: 3,
                name: "Xiaomi 14 Pro",
                category: "premium",
                badge: "Top sotuvlar",
                specs: "Snapdragon 8 Gen 3 • 256GB • Leica kamera",
                price: 9500000,
                image: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400&h=400&fit=crop"
            },
            {
                id: 4,
                name: "Google Pixel 8 Pro",
                category: "premium",
                badge: "AI qobiliyatlari",
                specs: "Google Tensor G3 • 256GB • Magic Eraser",
                price: 12000000,
                image: "https://images.unsplash.com/photo-1598618443855-232ee0f819f2?w=400&h=400&fit=crop"
            },
            {
                id: 5,
                name: "OnePlus 12",
                category: "premium",
                badge: "Tez zaryadlash",
                specs: "Snapdragon 8 Gen 3 • 256GB • 100W zaryadlash",
                price: 8900000,
                image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400&h=400&fit=crop"
            },
            {
                id: 6,
                name: "Redmi Note 13 Pro",
                category: "budget",
                badge: "Eng arzon",
                specs: "MediaTek Dimensity • 128GB • 200MP kamera",
                price: 3500000,
                image: "https://images.unsplash.com/photo-1574944985070-8f3ebc6b79d2?w=400&h=400&fit=crop"
            }
        ];

        let cart = [];
        let currentFilter = 'all';

        function displayProducts(filter = 'all') {
            const grid = document.getElementById('product-grid');
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
            
            grid.innerHTML = filtered.map(product => `
                <div class="product-card">
                    <div class="product-badge">${product.badge}</div>
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <h3 class="product-name">${product.name}</h3>
                    <p class="product-specs">${product.specs}</p>
                    <div class="product-price">${(product.price / 1000000).toFixed(1)} mln so'm</div>
                    <button class="buy-btn" onclick="addToCart(${product.id})">Savatga qo'shish</button>
                </div>
            `).join('');
        }

        function filterProducts(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            displayProducts(category);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({...product, quantity: 1});
            }
            
            updateCart();
            showNotification('Mahsulot savatga qo\'shildi! ✅');
        }

        function updateCart() {
            document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div>
                        <strong>${item.name}</strong><br>
                        <small>${item.quantity} x ${(item.price / 1000000).toFixed(1)} mln</small>
                    </div>
                    <button onclick="removeFromCart(${item.id})" style="background:none;border:none;color:#f5576c;cursor:pointer;font-size:20px;">×</button>
                </div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-total').textContent = (total / 1000000).toFixed(1) + ' mln';
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Savat bo\'sh!');
                return;
            }
            alert('Rahmat! Buyurtmangiz qabul qilindi. Tez orada siz bilan bog\'lanamiz! 📞');
            cart = [];
            updateCart();
            toggleCart();
        }

        function showNotification(message) {
            const notif = document.createElement('div');
            notif.textContent = message;
            notif.style.cssText = 'position:fixed;top:100px;right:20px;background:#4CAF50;color:white;padding:15px 25px;border-radius:10px;z-index:3000;animation:slideIn 0.3s;';
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2000);
        }

        function logout() {
            if (confirm('Rostdan ham chiqmoqchimisiz?')) {
                showNotification('Tizimdan muvaffaqiyatli chiqdingiz! 👋');
                setTimeout(() => {
                    alert('Yana ko\'rishguncha! 😊');
                }, 500);
            }
        }

        displayProducts();
    </script>
</body>
</html>
