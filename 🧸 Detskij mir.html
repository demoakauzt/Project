<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧸 Detskij Mir - Bolalar O'yinchoqlari</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255,255,255,0.3);
            border: 3px solid white;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .nav-btn:hover {
            background: white;
            color: #fa709a;
            transform: scale(1.08);
        }

        .logout-btn {
            background: rgba(255,0,0,0.4);
            border-color: #ff4444;
        }

        .logout-btn:hover {
            background: #ff4444;
            color: white;
        }

        .cart-btn {
            position: relative;
            background: #ff6b6b;
            border: 3px solid white;
            padding: 12px 28px;
            border-radius: 30px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cart-btn:hover {
            background: #ee5a52;
            transform: scale(1.1);
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #feca57;
            color: #2c3e50;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 900;
            border: 3px solid white;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 15px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hero p {
            font-size: 22px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* Gender Categories */
        .gender-categories {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .gender-card {
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .boys-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .girls-card {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .gender-card:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
        }

        .gender-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: wiggle 1s infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .gender-title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .gender-desc {
            font-size: 18px;
        }

        /* Products Section */
        .products-section {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 10px;
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: white;
            border: 3px solid #667eea;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s;
            color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.1);
        }

        .filter-btn:hover {
            transform: scale(1.05);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .product-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            transition: all 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-10px) rotate(1deg);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .product-image {
            width: 100%;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px;
            position: relative;
            overflow: hidden;
        }

        .boys-product .product-image {
            background: linear-gradient(135deg, #e0f7ff 0%, #b3e5fc 100%);
        }

        .girls-product .product-image {
            background: linear-gradient(135deg, #ffe0f0 0%, #ffc0e0 100%);
        }

        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ff6b6b;
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .product-age {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 26px;
            font-weight: 900;
            color: #667eea;
            margin-bottom: 15px;
        }

        .buy-button {
            width: 100%;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .buy-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(250, 112, 154, 0.4);
        }

        /* Cart Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-title {
            font-size: 32px;
            font-weight: 900;
            color: #2c3e50;
        }

        .close-btn {
            background: #ff6b6b;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            color: white;
            font-weight: 900;
        }

        .cart-item {
            display: flex;
            gap: 20px;
            padding: 20px;
            border-bottom: 3px solid #ecf0f1;
            background: #f8f9fa;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .cart-item-image {
            font-size: 60px;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 15px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .cart-item-price {
            font-size: 22px;
            font-weight: 900;
            color: #667eea;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .qty-btn {
            width: 35px;
            height: 35px;
            border: 3px solid #667eea;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            font-weight: 900;
            color: #667eea;
        }

        .qty-btn:hover {
            background: #667eea;
            color: white;
        }

        .quantity {
            font-size: 20px;
            font-weight: 900;
            min-width: 30px;
            text-align: center;
        }

        .cart-total {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 4px solid #667eea;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 28px;
            font-weight: 900;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }

        .empty-cart-icon {
            font-size: 100px;
            margin-bottom: 20px;
        }

        /* Success Message */
        .success-message {
            display: none;
            position: fixed;
            top: 100px;
            right: 20px;
            background: #2ecc71;
            color: white;
            padding: 20px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.4);
            z-index: 2000;
            font-weight: 700;
            font-size: 18px;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Scroll to Top Button */
        .scroll-top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            border: 4px solid white;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(250, 112, 154, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(100px);
        }

        .scroll-top-btn.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-top-btn:hover {
            transform: translateY(-8px) scale(1.15);
            box-shadow: 0 12px 35px rgba(250, 112, 154, 0.5);
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 36px;
            }

            .gender-categories {
                grid-template-columns: 1fr;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="logo">🧸 Detskij Mir</div>
            <div class="nav-buttons">
                <button class="nav-btn">Bosh sahifa</button>
                <button class="nav-btn">Katalog</button>
                <button class="cart-btn" onclick="toggleCart()">
                    🛒 Savat
                    <span class="cart-count" id="cart-count">0</span>
                </button>
                <button class="nav-btn logout-btn" onclick="logout()">
                    <a href="./index.html">🚪 Chiqish</a>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <div class="hero">
        <h1>🎈 Bolalar Olami 🎈</h1>
        <p>Eng zo'r o'yinchoqlar shu yerda!</p>
    </div>

    <!-- Gender Categories -->
    <div class="gender-categories">
        <div class="gender-card boys-card" onclick="filterGender('boys')">
            <div class="gender-icon"><a href="./👦 O'g'il Bolalar.html ">👦</a></div>
            <div class="gender-title">O'g'il Bolalar</div>
            <div class="gender-desc">Mashinalar, robotlar va ko'p narsalar!</div>
        </div>
        <div class="gender-card girls-card" onclick="filterGender('girls')">
            <div class="gender-icon"><a href="./👧 Qiz Bolalar.html">👧</a></div>
            <div class="gender-title">Qiz Bolalar</div>
            <div class="gender-desc">Qo'g'irchoqlar, uy jihozlari va go'zallik!</div>
        </div>
    </div>

    <!-- Products Section -->
    <div class="products-section">
        <div class="section-header">
            <h2 class="section-title" id="section-title">🌟 Barcha O'yinchoqlar 🌟</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterGender('all')">🎪 Hammasi</button>
                <button class="filter-btn" onclick="filterGender('boys')"><a href="./👦 O'g'il Bolalar.html">👦 O'g'il Bolalar</a></button>
                <button class="filter-btn" onclick="filterGender('girls')"><a href="./👧 Qiz Bolalar.html">👧 Qiz Bolalar</a></button>
            </div>
        </div>
        <div class="product-grid" id="product-grid"></div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal" onclick="if(event.target === this) toggleCart()">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">🛒 Savatingiz</h2>
                <button class="close-btn" onclick="toggleCart()">×</button>
            </div>
            <div id="cart-items"></div>
            <div class="cart-total" id="cart-total-section" style="display:none">
                <div class="total-row">
                    <span>Jami:</span>
                    <span id="cart-total-price">0 so'm</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">✅ Buyurtma berish</button>
            </div>
        </div>
    </div>

    <!-- Success Message -->
    <div class="success-message" id="success-message">
        ✅ Savatga qo'shildi!
    </div>

    <!-- Scroll to Top Button -->
    <button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()">
        ⬆️
    </button>

    <script>
        const products = [
            // O'g'il bolalar o'yinchoqlari
            { id: 1, name: "Racing Mashina", age: "3+ yosh", price: 250000, icon: "🏎️", gender: "boys", badge: "TOP" },
            { id: 2, name: "Robot Transformer", age: "5+ yosh", price: 450000, icon: "🤖", gender: "boys", badge: "YANGI" },
            { id: 3, name: "Lego Konstruktor", age: "4+ yosh", price: 380000, icon: "🧱", gender: "boys", badge: "HIT" },
            { id: 4, name: "Raketa Kosmonavt", age: "6+ yosh", price: 320000, icon: "🚀", gender: "boys", badge: "-15%" },
            { id: 5, name: "Poyezd To'plami", age: "3+ yosh", price: 420000, icon: "🚂", gender: "boys", badge: "TOP" },
            { id: 6, name: "Dinozavr T-Rex", age: "4+ yosh", price: 280000, icon: "🦖", gender: "boys", badge: "YANGI" },
            { id: 7, name: "Futbol To'pi", age: "5+ yosh", price: 150000, icon: "⚽", gender: "boys", badge: "HIT" },
            { id: 8, name: "Vertolyot RC", age: "7+ yosh", price: 550000, icon: "🚁", gender: "boys", badge: "-20%" },
            { id: 9, name: "Yuk Mashinasi", age: "3+ yosh", price: 220000, icon: "🚚", gender: "boys", badge: "TOP" },
            { id: 10, name: "Superman Aksiyadon", age: "5+ yosh", price: 180000, icon: "🦸", gender: "boys", badge: "YANGI" },

            // Qiz bolalar o'yinchoqlari
            { id: 11, name: "Barbie Qo'g'irchoq", age: "3+ yosh", price: 320000, icon: "👸", gender: "girls", badge: "TOP" },
            { id: 12, name: "O'yinchoq Oshxona", age: "4+ yosh", price: 480000, icon: "🍳", gender: "girls", badge: "YANGI" },
            { id: 13, name: "Unicorn Pelyush", age: "2+ yosh", price: 250000, icon: "🦄", gender: "girls", badge: "HIT" },
            { id: 14, name: "Printsessa Saroyi", age: "5+ yosh", price: 680000, icon: "🏰", gender: "girls", badge: "-15%" },
            { id: 15, name: "Baby Born Chaqaloq", age: "3+ yosh", price: 420000, icon: "👶", gender: "girls", badge: "TOP" },
            { id: 16, name: "Makiyaj To'plami", age: "6+ yosh", price: 180000, icon: "💄", gender: "girls", badge: "YANGI" },
            { id: 17, name: "Pony My Little", age: "4+ yosh", price: 220000, icon: "🦄", gender: "girls", badge: "HIT" },
            { id: 18, name: "O'yinchoq Doktor", age: "5+ yosh", price: 280000, icon: "🩺", gender: "girls", badge: "-20%" },
            { id: 19, name: "Ballerina Qo'g'irchoq", age: "4+ yosh", price: 350000, icon: "💃", gender: "girls", badge: "TOP" },
            { id: 20, name: "Hello Kitty Set", age: "3+ yosh", price: 290000, icon: "🐱", gender: "girls", badge: "YANGI" },
        ];

        let cart = [];
        let currentFilter = 'all';

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const filtered = currentFilter === 'all' 
                ? products 
                : products.filter(p => p.gender === currentFilter);

            grid.innerHTML = filtered.map(p => `
                <div class="product-card ${p.gender}-product">
                    <div class="product-image">
                        ${p.icon}
                        <div class="product-badge">${p.badge}</div>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-age">🎂 ${p.age}</div>
                        <div class="product-price">${p.price.toLocaleString()} so'm</div>
                        <button class="buy-button" onclick="addToCart(${p.id})">
                            🛒 Xarid qilish
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterGender(gender) {
            currentFilter = gender;
            
            // Update title
            const titles = {
                'all': '🌟 Barcha O\'yinchoqlar 🌟',
                'boys': '👦 O\'g\'il Bolalar Uchun',
                'girls': '👧 Qiz Bolalar Uchun'
            };
            document.getElementById('section-title').textContent = titles[gender];

            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            renderProducts();
            window.scrollTo({ top: 600, behavior: 'smooth' });
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCart();
            showSuccessMessage();
        }

        function updateCart() {
            document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            renderCart();
        }

        function renderCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const totalSection = document.getElementById('cart-total-section');

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <h3>Savat bo'sh</h3>
                        <p>O'yinchoqlar qo'shing!</p>
                    </div>
                `;
                totalSection.style.display = 'none';
                return;
            }

            cartItemsDiv.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-image">${item.icon}</div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">${item.price.toLocaleString()} so'm</div>
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="changeQuantity(${item.id}, -1)">-</button>
                            <span class="quantity">${item.quantity}</span>
                            <button class="qty-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-total-price').textContent = total.toLocaleString() + ' so\'m';
            totalSection.style.display = 'block';
        }

        function changeQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== productId);
            }

            updateCart();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('active');
        }

        function showSuccessMessage() {
            const msg = document.getElementById('success-message');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2000);
        }

        function checkout() {
            if (cart.length === 0) return;
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            alert(`✅ Buyurtma qabul qilindi!\n\n🎁 Jami: ${total.toLocaleString()} so'm\n\nBolangiz xursand bo'ladi! 😊`);
            
            cart = [];
            updateCart();
            toggleCart();
        }

        function logout() {
            const confirm = window.confirm('🚪 Saytdan chiqmoqchimisiz?');
            if (confirm) {
                alert('👋 Xayr!\n\nYana ko\'rishguncha! 🧸');
                cart = [];
                updateCart();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // Scroll to Top Button Control
        const scrollTopBtn = document.getElementById('scroll-top-btn');

        setTimeout(() => {
            scrollTopBtn.classList.add('show');
        }, 500);

        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 200) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });

        // Initial render
        renderProducts();
