<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👦 O'g'il Bolalar O'yinchoqlari</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #0575e6 0%, #021b79 100%);
            color: white;
            padding: 25px 0;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 38px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255,255,255,0.2);
            border: 3px solid white;
            color: white;
            padding: 14px 28px;
            border-radius: 35px;
            cursor: pointer;
            font-weight: 900;
            font-size: 16px;
            transition: all 0.3s;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }

        .nav-btn:hover {
            background: white;
            color: #0575e6;
            transform: scale(1.1);
        }

        .logout-btn {
            background: rgba(255,0,0,0.5);
            border-color: #ff4444;
        }

        .logout-btn:hover {
            background: #ff4444;
            color: white;
        }

        .cart-btn {
            position: relative;
            background: #ff6b35;
            border: 3px solid white;
            padding: 14px 32px;
            border-radius: 35px;
            color: white;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cart-btn:hover {
            background: #e55a2b;
            transform: scale(1.15);
        }

        .cart-count {
            position: absolute;
            top: -12px;
            right: -12px;
            background: #ffd700;
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 900;
            border: 4px solid white;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(135deg, #0575e6 0%, #021b79 100%);
            color: white;
            padding: 80px 20px;
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "⚡🏎️🚀🤖⚽🦖";
            position: absolute;
            font-size: 100px;
            opacity: 0.1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .hero h1 {
            font-size: 64px;
            margin-bottom: 20px;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.4);
            animation: pulse 2s infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .hero p {
            font-size: 26px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        /* Categories Section */
        .categories {
            max-width: 1400px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 40px;
            color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .category-card {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
            color: white;
            border: 4px solid rgba(255,255,255,0.3);
        }

        .category-card:hover {
            transform: translateY(-15px) rotate(-3deg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .category-icon {
            font-size: 90px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .category-name {
            font-size: 24px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Products Section */
        .products-section {
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0 50px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: white;
            border: 4px solid #0575e6;
            padding: 15px 35px;
            border-radius: 35px;
            cursor: pointer;
            font-weight: 900;
            font-size: 18px;
            transition: all 0.3s;
            color: #0575e6;
            text-transform: uppercase;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #0575e6 0%, #021b79 100%);
            color: white;
            transform: scale(1.15);
            box-shadow: 0 10px 30px rgba(5,117,230,0.4);
        }

        .filter-btn:hover {
            transform: scale(1.1);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 35px;
            margin-top: 50px;
        }

        .product-card {
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
            transition: all 0.4s;
            cursor: pointer;
            border: 5px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-15px) rotate(2deg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border-color: #0575e6;
        }

        .product-image {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #e0f7ff 0%, #b3e5fc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            position: relative;
            overflow: hidden;
        }

        .product-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff6b35;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 900;
            box-shadow: 0 5px 15px rgba(255,107,53,0.4);
            text-transform: uppercase;
        }

        .product-info {
            padding: 25px;
        }

        .product-name {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 12px;
            color: #0575e6;
            text-transform: uppercase;
        }

        .product-age {
            font-size: 15px;
            color: #666;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .product-desc {
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
        }

        .product-price {
            font-size: 32px;
            font-weight: 900;
            color: #ff6b35;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(255,107,53,0.2);
        }

        .buy-button {
            width: 100%;
            background: linear-gradient(135deg, #0575e6 0%, #021b79 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }

        .buy-button:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(5,117,230,0.5);
        }

        /* Cart Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 35px;
            padding: 45px;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 25px 70px rgba(0,0,0,0.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .modal-title {
            font-size: 36px;
            font-weight: 900;
            color: #0575e6;
        }

        .close-btn {
            background: #ff6b35;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            color: white;
            font-weight: 900;
        }

        .cart-item {
            display: flex;
            gap: 25px;
            padding: 25px;
            border-bottom: 4px solid #e0f7ff;
            background: #f8f9fa;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .cart-item-image {
            font-size: 70px;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0f7ff 0%, #b3e5fc 100%);
            border-radius: 20px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 10px;
            color: #0575e6;
        }

        .cart-item-price {
            font-size: 26px;
            font-weight: 900;
            color: #ff6b35;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 12px;
        }

        .qty-btn {
            width: 40px;
            height: 40px;
            border: 4px solid #0575e6;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 22px;
            font-weight: 900;
            color: #0575e6;
        }

        .qty-btn:hover {
            background: #0575e6;
            color: white;
        }

        .quantity {
            font-size: 24px;
            font-weight: 900;
            min-width: 35px;
            text-align: center;
        }

        .cart-total {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 5px solid #0575e6;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 32px;
            font-weight: 900;
            color: #0575e6;
            margin-bottom: 30px;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff6b35 0%, #e55a2b 100%);
            color: white;
            border: none;
            padding: 22px;
            border-radius: 25px;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .checkout-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(255,107,53,0.5);
        }

        .empty-cart {
            text-align: center;
            padding: 70px 20px;
            color: #888;
        }

        .empty-cart-icon {
            font-size: 120px;
            margin-bottom: 25px;
        }

        /* Success Message */
        .success-message {
            display: none;
            position: fixed;
            top: 100px;
            right: 20px;
            background: #2ecc71;
            color: white;
            padding: 25px 40px;
            border-radius: 25px;
            box-shadow: 0 12px 35px rgba(46,204,113,0.5);
            z-index: 2000;
            font-weight: 900;
            font-size: 20px;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(500px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Scroll to Top Button */
        .scroll-top-btn {
            position: fixed;
            bottom: 35px;
            right: 35px;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff6b35 0%, #e55a2b 100%);
            color: white;
            border: 5px solid white;
            border-radius: 50%;
            font-size: 36px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,107,53,0.5);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(100px);
        }

        .scroll-top-btn.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-top-btn:hover {
            transform: translateY(-10px) scale(1.2);
            box-shadow: 0 15px 40px rgba(255,107,53,0.6);
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 42px;
            }

            .category-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }
    </style>
</head>
