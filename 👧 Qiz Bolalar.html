<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qiz Bolalar O'yin Choqlari</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #ff6ec7 0%, #ff8ed4 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(255, 110, 199, 0.3);
        }

        .header h1 {
            color: white;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .header p {
            color: #fff;
            font-size: 1.2em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .categories {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            padding: 12px 25px;
            background: white;
            border: 3px solid #ff6ec7;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            color: #ff6ec7;
            transition: all 0.3s;
        }

        .category-btn:hover, .category-btn.active {
            background: #ff6ec7;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 110, 199, 0.4);
        }

        .logout-btn {
            display: block;
            margin: 0 auto 30px auto;
            padding: 15px 40px;
            background: linear-gradient(135deg, #ff6ec7 0%, #ff8ed4 100%);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 110, 199, 0.3);
        }

        .logout-btn a {
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .logout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 110, 199, 0.5);
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 110, 199, 0.3);
        }

        .product-icon {
            font-size: 4em;
            text-align: center;
            margin-bottom: 15px;
        }

        .product-name {
            font-size: 1.3em;
            color: #ff6ec7;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 1.5em;
            color: #333;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product-desc {
            color: #666;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff6ec7 0%, #ff8ed4 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 110, 199, 0.4);
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #ff6ec7;
            font-size: 1.1em;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Qiz Bolalar O'yin Choqlari ✨</h1>
            <p>Eng chiroyli va qiziqarli o'yinchoqlar</p>
        </div>

        <div class="categories">
            <button class="category-btn active" onclick="filterProducts('all')">Barchasi</button>
            <button class="category-btn" onclick="filterProducts('dolls')">Qo'g'irchoqlar</button>
            <button class="category-btn" onclick="filterProducts('kitchen')">Oshxona</button>
            <button class="category-btn" onclick="filterProducts('creative')">Ijodiy</button>
            <button class="category-btn" onclick="filterProducts('games')">O'yinlar</button>
        </div>

        <button class="logout-btn">
            <a href="./🧸 Detskij mir.html">🚪 O'yinlar</a>
        </button>

        <div class="products" id="products"></div>

        <div class="footer">
            💝 Har bir qizaloq uchun maxsus o'yinchoqlar 💝
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Barbie Qo'g'irchoq", price: "150,000 so'm", icon: "👸", category: "dolls", desc: "Go'zal kiyimli Barbie qo'g'irchoq" },
            { id: 2, name: "Oshxona To'plami", price: "200,000 so'm", icon: "🍳", category: "kitchen", desc: "Katta oshxona o'yin to'plami" },
            { id: 3, name: "Rasm Chizish To'plami", price: "85,000 so'm", icon: "🎨", category: "creative", desc: "Rangli qalamlar va albom" },
            { id: 4, name: "Kukla Uyi", price: "350,000 so'm", icon: "🏠", category: "dolls", desc: "Katta 3 qavatli kukla uyi" },
            { id: 5, name: "Choy Ichish To'plami", price: "95,000 so'm", icon: "☕", category: "kitchen", desc: "Pushti choynak va kosalar" },
            { id: 6, name: "Bizhuteriya To'plami", price: "120,000 so'm", icon: "💎", category: "creative", desc: "Munchoq va bezaklar yasash" },
            { id: 7, name: "Lol Surprise", price: "180,000 so'm", icon: "🎁", category: "dolls", desc: "Syurprizli qo'g'irchoq" },
            { id: 8, name: "Do'kon O'yini", price: "220,000 so'm", icon: "🛍️", category: "games", desc: "Kichik do'kon o'ynash uchun" },
            { id: 9, name: "Plastilin To'plami", price: "65,000 so'm", icon: "🌈", category: "creative", desc: "Rangdor plastilinlar" },
            { id: 10, name: "Bebek Aracha", price: "280,000 so'm", icon: "👶", category: "dolls", desc: "Qo'g'irchoq aravachasi" },
            { id: 11, name: "Pazl To'plami", price: "75,000 so'm", icon: "🧩", category: "games", desc: "1000 bo'lakli pazl" },
            { id: 12, name: "Sehrli Tayoqcha", price: "55,000 so'm", icon: "✨", category: "games", desc: "Yorug'likli sehrli tayoqcha" }
        ];

        let currentFilter = 'all';

        function displayProducts() {
            const container = document.getElementById('products');
            const filtered = currentFilter === 'all' 
                ? products 
                : products.filter(p => p.category === currentFilter);
            
            container.innerHTML = filtered.map(product => `
                <div class="product-card">
                    <div class="product-icon">${product.icon}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-desc">${product.desc}</div>
                    <div class="product-price">${product.price}</div>
                    <button class="buy-btn" onclick="buyProduct('${product.name}')">Sotib olish</button>
                </div>
            `).join('');
        }

        function filterProducts(category) {
            currentFilter = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            displayProducts();
        }

        function buyProduct(name) {
            alert('Rahmat! "' + name + '" savatga qo\'shildi! 🎀');
        }

        displayProducts();
    </script>
</body>
</html>
